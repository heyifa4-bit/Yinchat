<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>明阴全自动小说</title>
<style>
:root {
  --bg: #f5f6f7; --panel: #ffffff; --sidebar: #f0f1f3; --text: #1f2329;
  --muted: #8a9099; --accent: #3370ff; --user-bubble: #95ec69;
  --ai-bubble: #ffffff; --border: #e4e6eb;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; font-family: "Microsoft YaHei", system-ui, sans-serif; background: var(--bg); color: var(--text); }
#app { display: flex; height: 100vh; }

/* 侧边栏（活动侧边栏，可开关） */
#sidebar { width: 260px; min-width: 260px; background: var(--sidebar); display: flex; flex-direction: column; border-right: 1px solid var(--border); transition: margin-left .18s ease; }
#app.sidebar-hidden #sidebar { margin-left: -260px; }
#session-list { flex: 2; overflow-y: auto; padding: 8px; }
.session-item { display: flex; justify-content: space-between; align-items: center; width: 100%; padding: 10px 12px; margin-bottom: 4px; border: none; border-radius: 8px; background: transparent; text-align: left; cursor: pointer; color: var(--text); font-size: 14px; }
.session-item:hover { background: #e4e6eb; }
.session-item.active { background: #dbe4ff; }
.session-item .del { color: var(--muted); padding: 0 4px; }
.session-item .del:hover { color: #f24822; }
#btn-new-session { width: 100%; padding: 8px; margin-bottom: 8px; border: 1px dashed var(--border); border-radius: 8px; background: transparent; cursor: pointer; color: var(--muted); }
#sidebar-bottom { flex: 1; border-top: 1px solid var(--border); padding: 8px; display: flex; flex-direction: column; gap: 6px; }
.side-btn { padding: 10px; border: none; border-radius: 8px; background: var(--panel); cursor: pointer; font-size: 14px; }

/* 主界面 */
#main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
#topbar { display: flex; align-items: center; gap: 10px; padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--border); }
#btn-sidebar { border: none; background: transparent; font-size: 20px; cursor: pointer; color: var(--text); }
#session-name { font-size: 15px; font-weight: 600; flex: 1; }
#topbar .tip { font-size: 12px; color: var(--muted); }

/* 消息区 */
#messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.msg { max-width: 72%; padding: 10px 14px; border-radius: 10px; white-space: pre-wrap; word-break: break-word; line-height: 1.6; font-size: 14px; position: relative; cursor: context-menu; user-select: text; -webkit-user-select: text; }
.msg.user { align-self: flex-end; background: var(--user-bubble); border-top-right-radius: 2px; }
.msg.ai { align-self: flex-start; background: var(--ai-bubble); border: 1px solid var(--border); border-top-left-radius: 2px; }
.msg.error { border: 1px solid #f24822; color: #c0392b; }
.msg.loading::after { content: "…"; animation: blink 1s infinite; }
@keyframes blink { 50% { opacity: 0; } }

/* 输入区 */
#input-bar { display: flex; gap: 8px; padding: 12px 16px; background: var(--panel); border-top: 1px solid var(--border); }
#input { flex: 1; resize: none; height: 60px; max-height: 180px; padding: 10px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; font-family: inherit; outline: none; overflow-y: auto; }
#send { padding: 0 22px; border: none; border-radius: 8px; background: var(--accent); color: #fff; font-size: 14px; cursor: pointer; }
#send:disabled { background: #b9c6f0; cursor: not-allowed; }

/* 右键菜单 */
#ctxmenu { position: fixed; z-index: 100; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; box-shadow: 0 4px 16px rgba(0,0,0,.12); padding: 4px; display: none; min-width: 120px; }
#ctxmenu button { display: block; width: 100%; padding: 8px 12px; border: none; background: transparent; text-align: left; cursor: pointer; font-size: 13px; border-radius: 6px; }
#ctxmenu button:hover { background: #f0f1f3; }
#ctxmenu button.danger { color: #f24822; }

/* 弹窗 */
#modal-mask { position: fixed; inset: 0; background: rgba(0,0,0,.35); display: none; z-index: 50; }
#modal { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: min(560px, 92vw); max-height: 86vh; overflow-y: auto; background: var(--panel); border-radius: 12px; box-shadow: 0 8px 32px rgba(0,0,0,.2); display: none; z-index: 60; padding: 20px; }
#modal h2 { font-size: 16px; margin-bottom: 16px; }
#modal .form-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; font-size: 14px; }
#modal .form-row label { min-width: 120px; color: var(--text); }
#modal .form-row input[type=text], #modal .form-row textarea, #modal .form-row select { flex: 1; padding: 8px; border: 1px solid var(--border); border-radius: 6px; font-size: 14px; }
#modal .form-row textarea { min-height: 70px; resize: vertical; }
#modal .form-row .hint { font-size: 12px; color: var(--muted); }
#modal .btns { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
#modal .btns button { padding: 8px 16px; border-radius: 6px; border: 1px solid var(--border); background: var(--panel); cursor: pointer; font-size: 14px; }
#modal .btns button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
.modal-card { border: 1px solid var(--border); border-radius: 8px; padding: 12px; margin-bottom: 12px; }
.modal-card h3 { font-size: 14px; margin-bottom: 10px; color: var(--text); }
.modal-card .form-row label { min-width: 90px; }
.plugin-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 14px; }
.plugin-item:last-child { border-bottom: none; }
</style>
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div id="session-list">
      <button id="btn-new-session">＋ 新建对话</button>
      <div id="sessions"></div>
    </div>
    <div id="sidebar-bottom">
      <button class="side-btn" id="btn-model-settings">⚙ 模型设置</button>
      <button class="side-btn" id="btn-plugin-settings">🧩 插件设置</button>
      <button class="side-btn" id="btn-session-settings">📝 单对话设置</button>
    </div>
  </aside>
  <main id="main">
    <header id="topbar">
      <button id="btn-sidebar">☰</button>
      <span id="session-name">新对话</span>
      <span class="tip">发送消息即开始；// 开头为命令</span>
    </header>
    <div id="messages"></div>
    <div id="input-bar">
      <textarea id="input" placeholder="输入消息…（Enter 发送，Shift+Enter 换行）"></textarea>
      <button id="send">发送</button>
    </div>
  </main>
</div>

<div id="ctxmenu"></div>
<div id="modal-mask"></div>
<div id="modal">
  <h2 id="modal-title">设置</h2>
  <div id="modal-body"></div>
  <div class="btns">
    <button id="modal-cancel">取消</button>
    <button id="modal-ok" class="primary">确定</button>
  </div>
</div>

<script>
/* ========== 状态 ========== */
let currentSid = null;
let sending = false;

/* ========== 工具 ========== */
async function api(url, method, body, signal) {
  const opt = { method: method || "GET", headers: {}, signal };
  if (body !== undefined) { opt.headers["Content-Type"] = "application/json"; opt.body = JSON.stringify(body); }
  const r = await fetch(url, opt);
  if (!r.ok) {
    let msg = "HTTP " + r.status;
    try {
      const j = await r.json();
      const d = j && j.detail;
      msg = (typeof d === "string" && d) ? d : (d !== undefined ? JSON.stringify(d) : msg);
    } catch (e2) {
      try { msg = "HTTP " + r.status + ": " + (await r.text()).slice(0, 500); } catch (e3) {}
    }
    throw new Error(msg);
  }
  return r.json();
}
function esc(s) { const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
function scrollBottom() { const b = document.getElementById("messages"); b.scrollTop = b.scrollHeight; }

/* ========== 会话 ========== */
async function loadSessions() {
  const list = await api("/api/sessions");
  const box = document.getElementById("sessions");
  box.innerHTML = "";
  for (const s of list) {
    const el = document.createElement("button");
    el.className = "session-item" + (s.session_id === currentSid ? " active" : "");
    const span = document.createElement("span");
    span.textContent = s.name;
    el.appendChild(span);
    const del = document.createElement("span");
    del.className = "del"; del.textContent = "✕";
    del.onclick = (e) => { e.stopPropagation(); deleteSession(s.session_id); };
    el.appendChild(del);
    el.onclick = () => openSession(s.session_id);
    box.appendChild(el);
  }
}
async function newSession() {
  const r = await api("/api/sessions", "POST");
  currentSid = r.session_id;
  document.getElementById("session-name").textContent = r.name;
  document.getElementById("messages").innerHTML = "";
  await loadSessions();
}
async function deleteSession(sid) {
  if (!confirm("删除该对话？")) return;
  await api("/api/sessions/" + sid, "DELETE");
  if (currentSid === sid) { currentSid = null; document.getElementById("messages").innerHTML = ""; document.getElementById("session-name").textContent = "新对话"; }
  await loadSessions();
}
async function openSession(sid) {
  currentSid = sid;
  const s = await api("/api/sessions/" + sid);
  document.getElementById("session-name").textContent = s.name;
  await loadSessions();
  renderMessages(s.messages);
}

/* ========== 消息 ========== */
function buildMsg(m) {
  const el = document.createElement("div");
  el.className = "msg " + (m.role === "user" ? "user" : "ai");
  el.dataset.mid = m.message_id; el.dataset.role = m.role;
  el.textContent = m.content;
  el.oncontextmenu = (e) => { e.preventDefault(); showCtxMenu(e, m); };
  return el;
}
function renderMessages(messages) {
  const box = document.getElementById("messages");
  box.innerHTML = "";
  for (const m of messages) box.appendChild(buildMsg(m));
  scrollBottom();
}
function appendMsg(m) {
  document.getElementById("messages").appendChild(buildMsg(m));
  scrollBottom();
}

/* ========== 发送 / 停止 / 重试 ========== */
let currentAbort = null;   // 当前请求的 AbortController

function setSendButton(active) {
  const b = document.getElementById("send");
  b.textContent = active ? "停止" : "发送";
  b.disabled = false;
}
function removeLoading() {
  const l = document.querySelector(".msg.loading");
  if (l) l.remove();
}
async function stopNow() {
  // 强行停止当前发送/接收：中止请求 + 通知后端取消生成任务
  if (currentAbort) { try { currentAbort.abort(); } catch (e) {} }
  if (currentSid) {
    try { await api("/api/sessions/" + currentSid + "/stop", "POST", {}); } catch (e) {}
  }
  removeLoading();
  currentAbort = null;
  sending = false;
  setSendButton(false);
}
async function sendMessage() {
  const inp = document.getElementById("input");
  const text = inp.value.trim();
  if (!text || sending) return;
  inp.value = ""; inp.style.height = "60px";
  await doChat(text, "写作中…");
}
async function doChat(text, tip) {
  if (!currentSid) { const r = await api("/api/sessions", "POST"); currentSid = r.session_id; }
  sending = true; setSendButton(true);
  const controller = new AbortController();
  currentAbort = controller;
  // 先显示用户气泡（生成完成后 openSession 会用真实消息重新渲染替换）
  const userEl = buildMsg({ role: "user", content: text, message_id: "__tmp_" + Date.now() });
  document.getElementById("messages").appendChild(userEl);
  // 再显示 AI"写作中"气泡
  const loading = document.createElement("div");
  loading.className = "msg ai loading"; loading.textContent = tip;
  document.getElementById("messages").appendChild(loading);
  scrollBottom();
  try {
    await api("/api/sessions/" + currentSid + "/chat", "POST", { text }, controller.signal);
    loading.remove();
    await openSession(currentSid);
  } catch (e) {
    if (e.name === "AbortError") { /* 用户已停止 */ }
    else {
      loading.remove();
      const err = document.createElement("div");
      err.className = "msg ai error"; err.textContent = "❌ " + (e && e.message ? e.message : String(e));
      document.getElementById("messages").appendChild(err);
    }
  } finally {
    if (currentAbort === controller) currentAbort = null;
    sending = false; setSendButton(false);
  }
}
async function retryLast() {
  if (!currentSid || sending) return;
  sending = true; setSendButton(true);
  const controller = new AbortController();
  currentAbort = controller;
  const loading = document.createElement("div");
  loading.className = "msg ai loading"; loading.textContent = "重试中…";
  document.getElementById("messages").appendChild(loading);
  scrollBottom();
  try {
    await api("/api/sessions/" + currentSid + "/retry", "POST", {}, controller.signal);
    loading.remove();
    await openSession(currentSid);
  } catch (e) {
    if (e.name !== "AbortError") { loading.remove(); alert("重试失败: " + (e && e.message ? e.message : String(e))); }
  } finally {
    if (currentAbort === controller) currentAbort = null;
    sending = false; setSendButton(false);
  }
}


/* ========== 右键菜单 ========== */
function showCtxMenu(e, m) {
  const menu = document.getElementById("ctxmenu");
  menu.innerHTML = "";
  const add = (label, fn, danger) => {
    const b = document.createElement("button");
    b.textContent = label;
    if (danger) b.className = "danger";
    b.onclick = () => { hideCtxMenu(); fn(); };
    menu.appendChild(b);
  };
  add("复制", () => copyMsg(m.content));
  add("修改", () => openEditModal(m));
  add("删除", () => deleteMsg(m.message_id), true);
  if (m.role === "user") {
    add("重新发送", () => sendText(m.content));
  }
  add("重试", () => retryLast());
  menu.style.display = "block";
  menu.style.left = Math.min(e.clientX, window.innerWidth - 140) + "px";
  menu.style.top = Math.min(e.clientY, window.innerHeight - menu.offsetHeight) + "px";
}
function hideCtxMenu() { document.getElementById("ctxmenu").style.display = "none"; }
async function copyMsg(text) {
  let ok = false;
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(text);
      ok = true;
    }
  } catch (e) { /* 走兜底 */ }
  if (!ok) {
    try {
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.focus(); ta.select();
      ok = document.execCommand("copy");
      ta.remove();
    } catch (e) { ok = false; }
  }
  alert(ok ? "✅ 已复制" : "❌ 复制失败");
}
async function deleteMsg(mid) {
  await api("/api/messages/" + mid, "DELETE");
  await openSession(currentSid);
}
async function sendText(text) {
  if (!text || sending) return;
  await doChat(text, "写作中…");
}


/* ========== 弹窗 ========== */
let modalOkHandler = null;
function openModal(title, bodyHtml) {
  document.getElementById("modal-title").textContent = title;
  document.getElementById("modal-body").innerHTML = bodyHtml;
  document.getElementById("modal").style.display = "block";
  document.getElementById("modal-mask").style.display = "block";
}
function closeModal() {
  document.getElementById("modal").style.display = "none";
  document.getElementById("modal-mask").style.display = "none";
  modalOkHandler = null;
}

/* ---- 消息编辑 ---- */
function openEditModal(m) {
  openModal("修改消息",
    `<textarea id="edit-content" style="width:100%;min-height:120px;">${esc(m.content)}</textarea>`);
  const inp = document.getElementById("edit-content");
  inp.focus();
  inp.onkeydown = (e) => {
    if (e.key === "Escape") closeModal();
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); saveEdit(m.message_id); }
  };
  modalOkHandler = () => saveEdit(m.message_id);
  document.getElementById("modal-ok").textContent = "确定";
}
async function saveEdit(mid) {
  const content = document.getElementById("edit-content").value;
  await api("/api/messages/" + mid, "PATCH", { content });
  closeModal();
  await openSession(currentSid);
}

/* ---- 单对话设置 ---- */
async function openSessionSettings() {
  if (!currentSid) { alert("请先选择对话"); return; }
  const s = await api("/api/sessions/" + currentSid + "/settings");
  const cmds = (await api("/api/settings/commands")).commands;
  let html = `<div class="form-row"><label>对话名</label><input type="text" id="ss-name" value="${esc(s.name)}"></div>`;
  html += `<div class="form-row"><label>温度</label><input type="text" id="ss-temp" value="${s.temperature}"></div>`;
  for (const c of cmds) {
    const key = c.key;
    const val = (s.settings && s.settings[key] !== undefined) ? s.settings[key] : c.default;
    const label = c.label || key;
    let ctrl = "";
    if (c.type === "bool") {
      ctrl = `<select id="ss-${key}"><option value="true" ${val ? "selected" : ""}>开启</option><option value="false" ${val ? "" : "selected"}>关闭</option></select>`;
    } else if (c.type === "select") {
      ctrl = `<select id="ss-${key}">` + (c.options || []).map(o => `<option ${String(o) === String(val) ? "selected" : ""}>${esc(o)}</option>`).join("") + `</select>`;
    } else {
      ctrl = `<input type="text" id="ss-${key}" value="${esc(val)}">`;
    }
    html += `<div class="form-row"><label title="${esc(c.hint || "")}">${esc(label)}</label>${ctrl}</div>`;
  }
  openModal("单对话设置", html);
  modalOkHandler = async () => {
    const settings = {};
    for (const c of cmds) {
      const el = document.getElementById("ss-" + c.key);
      if (!el) continue;
      const v = el.value;
      settings[c.key] = (v === "true") ? true : (v === "false") ? false : v;
    }
    await api("/api/sessions/" + currentSid + "/settings", "PATCH", { settings });
    const name = document.getElementById("ss-name").value.trim();
    const temp = parseFloat(document.getElementById("ss-temp").value);
    if (name) await api("/api/sessions/" + currentSid + "/name", "PATCH", { name });
    if (!isNaN(temp)) await api("/api/sessions/" + currentSid + "/temperature", "PATCH", { temperature: temp });
    closeModal();
    await loadSessions();
    await openSession(currentSid);
  };
  document.getElementById("modal-ok").textContent = "保存";
}


/* ---- 模型设置 ---- */
async function openModelSettings() {
  const data = await api("/api/models");
  const labels = { generator_api: "主对话模型", func_api1: "功能 API 1", func_api2: "功能 API 2", outline_api1: "大纲 API 1", outline_api2: "大纲 API 2" };
  let html = `<div class="form-row"><label>自动补全 /v1/chat/completions</label><select id="md-auto"><option value="true" ${data.auto_complete_base_url ? "selected" : ""}>开启</option><option value="false" ${data.auto_complete_base_url ? "" : "selected"}>关闭</option></select></div>`;
  for (const key of Object.keys(labels)) {
    const m = data.models[key] || {};
    html += `<div class="modal-card"><h3>${labels[key]}</h3>`;
    html += `<div class="form-row"><label>Base URL</label><input type="text" id="md-${key}-url" value="${esc(m.base_url || "")}" placeholder="https://api.deepseek.com"></div>`;
    html += `<div class="form-row"><label>API Key</label><input type="text" id="md-${key}-key" value="${esc(m.api_key || "")}"></div>`;
    html += `<div class="form-row"><label>模型 ID</label><input type="text" id="md-${key}-models" value="${esc(m.models || "")}" placeholder="多个用半角逗号分隔"></div>`;
    html += `</div>`;
  }
  openModal("模型设置", html);
  modalOkHandler = async () => {
    const models = {};
    for (const key of Object.keys(labels)) {
      models[key] = {
        base_url: document.getElementById("md-" + key + "-url").value.trim(),
        api_key: document.getElementById("md-" + key + "-key").value.trim(),
        models: document.getElementById("md-" + key + "-models").value.trim(),
      };
    }
    models.auto_complete_base_url = document.getElementById("md-auto").value === "true";
    await api("/api/models", "PUT", { models });
    closeModal();
  };
  document.getElementById("modal-ok").textContent = "保存";
}

/* ---- 插件设置 ---- */
async function openPluginSettings() {
  const data = await api("/api/plugins");
  let html = "";
  for (const p of data.loaded) {
    html += `<div class="plugin-item"><span><b>${esc(p.name)}</b> <small style="color:var(--muted)">priority ${p.priority} · ${esc(p.description || "")}</small></span></div>`;
  }
  html += `<button class="side-btn" id="reload-plugins" style="margin-top:8px;">🔄 重载插件</button>`;
  openModal("插件设置", html);
  document.getElementById("reload-plugins").onclick = async () => {
    await api("/api/plugins/reload", "POST", {});
    closeModal();
    alert("插件已重载");
  };
  modalOkHandler = () => closeModal();
  document.getElementById("modal-ok").textContent = "关闭";
}

/* ========== 事件绑定 ========== */
document.getElementById("send").onclick = () => { if (sending) stopNow(); else sendMessage(); };
document.getElementById("btn-sidebar").onclick = () => document.getElementById("app").classList.toggle("sidebar-hidden");
document.getElementById("btn-new-session").onclick = newSession;
document.getElementById("btn-session-settings").onclick = openSessionSettings;
document.getElementById("btn-model-settings").onclick = openModelSettings;
document.getElementById("btn-plugin-settings").onclick = openPluginSettings;
document.getElementById("modal-ok").onclick = () => { if (modalOkHandler) modalOkHandler(); };
document.getElementById("modal-cancel").onclick = closeModal;
document.getElementById("modal-mask").onclick = closeModal;
document.addEventListener("click", (e) => {
  if (!document.getElementById("ctxmenu").contains(e.target)) hideCtxMenu();
});
document.getElementById("input").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});
document.getElementById("input").addEventListener("input", (e) => {
  e.target.style.height = "60px";
  e.target.style.height = Math.min(e.target.scrollHeight, 180) + "px";
});

/* ========== 初始化 ========== */
(async function init() {
  try {
    await loadSessions();
    const list = await api("/api/sessions");
    if (list.length > 0) await openSession(list[0].session_id);
  } catch (e) {
    document.getElementById("messages").innerHTML =
      `<div class="msg ai error">启动失败: ${esc(e.message)}</div>`;
  }
})();
</script>
</body>
</html>
